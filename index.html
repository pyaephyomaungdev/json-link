  <!-- Critical hero paint. Self-hosted faces load from the stylesheet with font-display: swap. -->

      line-height: 1.6;
      color: #475569;
    }
    html.dark .seo-hero p { color: #94a3b8; }
  </style>
  <!-- Immediate theme pre-loader to prevent flickering on reload -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('json_link_theme');
        var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }
    })();
  </script>
