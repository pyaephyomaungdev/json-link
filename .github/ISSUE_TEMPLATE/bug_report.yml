name: Bug Report
description: Report a defect, unexpected behavior, or parsing error in JSON Link.
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide sufficient detail so we can reproduce and resolve it quickly.
  - type: input
    id: version
    attributes:
      label: Version / Commit
      description: What version or commit of JSON Link are you running (or which browser / platform)?
      placeholder: e.g. v1.0.0, https://json-link.pages.dev
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Clear steps to reproduce the behavior.
      placeholder: |
        1. Open JSON Link
        2. Import sample file...
        3. Click on...
        4. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: sample-payload
    attributes:
      label: Sample File or Payload (Optional)
      description: Minimal sanitized JSON, CSV, or translation snippet that triggers the issue.
      render: json
  - type: dropdown
    id: browser
    attributes:
      label: Browser / Environment
      multiple: true
      options:
        - Chrome / Chromium
        - Firefox
        - Safari
        - Edge
        - Node.js (CLI / Vite Plugin)
        - Mobile Browser
